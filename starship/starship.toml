add_newline = false

format = """
$cmake\
$java\
$python\
$character\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status """


[cmake]
format = '[cmake ](italic #fabd2f)'


[java]
detect_files = ['pom.xml']
format = '[mvn ](italic #fabd2f)'


[python]
format = '([$virtualenv ](italic #fabd2f))'


[character]
success_symbol = '[➜](#a89984)'
error_symbol = '[➜](#a89984)'


[directory]
truncation_length = 1
read_only = '󱈸'
format = '[$read_only](#fe8019)[$path](#b8bb26)'


[git_branch]
truncation_length = 8
truncation_symbol = '…'
format = '\([$branch](#83a598)'


[git_commit]
commit_hash_length = 7
format = '\([$hash](#83a598)'
only_detached = true
tag_disabled = true


[git_state]
rebase = "RBS"
merge = "MRG"
revert = "RVT"
cherry_pick = "PCK"
bisect = "BSC"
am = "AM "
am_or_rebase = "AMR"
format = ' [$state](#d3869b)'


[git_status]
ahead = '↑'
behind = '↓'
diverged = '↕'
conflicted = '!'
untracked = '?'
stashed = '='
modified = '*'
staged = '+'
renamed = '~'
deleted = 'x'
typechanged = 'T'
format = '[$ahead_behind$all_status](#d3869b)\)'
