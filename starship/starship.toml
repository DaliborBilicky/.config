add_newline = false

format = """
$username\
$directory\
$python\
$cmake\
$java\
$git_branch\
$git_commit\
$git_status\
$git_state\
$line_break\
$character"""


[username]
format = '[󰣛 ](#d5c4a1)[:](#928374)[$user](bright-cyan) '
disabled = false
show_always = true


[directory]
truncation_length = 1
truncation_symbol = ''
read_only = '󱈸'
format = '[in ](#fe8019)[ ](#d5c4a1)[:](#928374)[$read_only$path](bright-blue) '


[python]
format = '([is ](#fe8019)[ ](#d5c4a1)[:](#928374)[$virtualenv](bright-yellow) )'


[cmake]
format = '[is ](#fe8019)[ ](#d5c4a1)[:](#928374)[cmake](bright-yellow) '


[java]
format = '[is ](#fe8019)[ ](#d5c4a1)[:](#928374)[maven](bright-yellow) '
detect_extensions = []
detect_files = ['pom.xml']


[git_branch]
truncation_length = 6
truncation_symbol = '…'
format = '[as ](bright-red)[ ](#d5c4a1)[:](#928374)[$branch](bright-green)'


[git_commit]
commit_hash_length = 7
format = '[as ](bright-red)[](#d5c4a1)[:](#928374)[$hash](bright-green)'
only_detached = true
tag_disabled = true


[git_status]
ahead = '[↑](bright-green)'
behind = '[↓](bright-green)'
diverged = '[↕](bright-green)'
conflicted = '[!](#fe8019)[$count](bright-purple)'
untracked = '[?](#fe8019)[$count](bright-purple)'
stashed = '[=](#fe8019)[$count](bright-purple)'
modified = '[*](#fe8019)[$count](bright-purple)'
staged = '[+](#fe8019)[$count](bright-purple)'
renamed = '[~](#fe8019)[$count](bright-purple)'
deleted = '[x](#fe8019)[$count](bright-purple)'
typechanged = '[T](#fe8019)[$count](bright-purple)'
format = '($ahead_behind(\($all_status\)))'


[git_state]
rebase = 'Rebase'
merge = 'Merge'
revert = 'Revert'
cherry_pick = 'CherryPick'
bisect = 'Bisect'
am = 'AM'
am_or_rebase = 'AMRebase'
format = '[ -> ](#fe8019)[$state](fg:bright-purple italic)'


[character]
success_symbol = ''
error_symbol = ''
